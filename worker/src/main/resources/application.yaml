app:
  gameAbort: ${GAME_ABORT:true}
  gameAbortTimer: ${GAME_ABORT_TIMER:2}
  botToken: ${BOT_TOKEN}
  polyglot_file: ${POLYGLOT_FILE}
  syzygy_path: ${SYZYGY_PATH}

spring:
  application:
    name: sosa-worker

  main:
    web-application-type: none

  rabbitmq:
    host: ${RABBIT_HOST}
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    virtual-host: /
    # Recommended for publishers:
    publisher-confirm-type: correlated
    publisher-returns: true

  quartz:
    job-store-type: memory
    properties.org.quartz.threadPool.threadCount: 1